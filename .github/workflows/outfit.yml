name: outfit
on:
  schedule: [{cron: "40 21 * * *"}]  # 06:40 KST, GitHub 지연 감안해 일찍 시작 → 스크립트가 07:00까지 대기
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python outfit.py
        env: {DISCORD_WEBHOOK: "${{ secrets.DISCORD_WEBHOOK }}", KMA_KEY: "${{ secrets.KMA_KEY }}"}
